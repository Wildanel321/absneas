# Smart Attendance - Konfigurasi Nginx untuk Raspberry Pi 3 (ARM64)
# Simpan ke /etc/nginx/sites-available/smart-attendance
# Lalu aktifkan: sudo ln -s /etc/nginx/sites-available/smart-attendance /etc/nginx/sites-enabled/

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/smart-attendance/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 32M;

    # Kompresi ringan untuk aset frontend
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;

    # Header keamanan tambahan di level Nginx
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Blokir file tersembunyi, backup, dan file konfigurasi
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(sqlite|sqlite3|db|sql|env|log|sh|bak)$ {
        deny all;
        return 404;
    }

    # Service Worker tidak boleh di-cache terlalu lama oleh browser
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Aset statis PWA (cache 7 hari)
    location ~* ^/(assets|icons)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Route utama diarahkan ke front controller public/index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM (sesuaikan versi socket PHP di Raspberry Pi OS, misal php8.2-fpm.sock atau php8.3-fpm.sock)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm-smart-attendance.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
        fastcgi_param HTTP_CF_VISITOR $http_cf_visitor;
        fastcgi_read_timeout 30s;
    }

    access_log /var/log/nginx/smart-attendance-access.log;
    error_log /var/log/nginx/smart-attendance-error.log warn;
}

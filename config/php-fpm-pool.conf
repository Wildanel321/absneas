; Smart Attendance - PHP-FPM Pool khusus Raspberry Pi 3 Model B (1GB RAM)
; Salin ke /etc/php/<versi>/fpm/pool.d/smart-attendance.conf

[smart-attendance]
user = www-data
group = www-data

listen = /run/php/php-fpm-smart-attendance.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Mode ondemand menjaga penggunaan RAM tetap rendah saat tidak ada scan QR aktif
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 15s
pm.max_requests = 500

; Batas keamanan & performa ARM64
php_admin_value[memory_limit] = 64M
php_admin_value[upload_max_filesize] = 30M
php_admin_value[post_max_size] = 32M
php_admin_value[max_execution_time] = 30
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/smart-attendance/storage/logs/php-fpm.log
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 32
php_admin_value[opcache.max_accelerated_files] = 1000
php_admin_value[opcache.validate_timestamps] = 0
